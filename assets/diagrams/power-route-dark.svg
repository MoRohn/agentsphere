<svg xmlns="http://www.w3.org/2000/svg" width="830" height="360" viewBox="0 0 830 360" role="img" aria-labelledby="title desc">
  <title id="title">Change one thin part</title>
  <desc id="desc">Tune the harness, then debug with a single change.</desc>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600">Change one thin part</text>
  <rect x="40" y="72" width="96" height="5" rx="2" fill="#F5A31A"/>
  <text x="40" y="112" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">A stuck loop gets one edit, then a retest.</text>
  <line x1="40" y1="136" x2="790" y2="136" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="48" cy="160" r="8" fill="#F5A31A"/>
  <text x="70" y="168" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Tune</text>
  <text x="70" y="200" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">The part the task will stress</text>
  <circle cx="440" cy="160" r="8" fill="#FFE0B0"/>
  <text x="462" y="168" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Many agents</text>
  <text x="462" y="200" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">A lead, then a merge</text>
  <circle cx="48" cy="272" r="8" fill="#FF9A2E"/>
  <text x="70" y="280" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Workflow</text>
  <text x="70" y="312" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">A path you can run again</text>
  <circle cx="440" cy="272" r="8" fill="#F5A31A"/>
  <text x="462" y="280" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Debug</text>
  <text x="462" y="312" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">One change, then the same task</text>
</svg>
