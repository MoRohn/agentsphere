<svg xmlns="http://www.w3.org/2000/svg" width="830" height="560" viewBox="0 0 830 560" role="img" aria-labelledby="title desc">
  <title id="title">Build one small agent</title>
  <desc id="desc">Five steps: a loop, a tool, notes, a skill, and a check.</desc>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600">Build one small agent</text>
  <rect x="40" y="72" width="96" height="5" rx="2" fill="#F5A31A"/>
  <text x="40" y="112" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Add one piece at a time. Stop when the check passes.</text>
  <line x1="40" y1="136" x2="790" y2="136" stroke="#30363D" stroke-width="1.5"/>
  <line x1="56" y1="188" x2="56" y2="492" stroke="#30363D" stroke-width="2"/>
  <circle cx="56" cy="176" r="18" fill="#F5A31A"/>
  <text x="56" y="182" text-anchor="middle" fill="#10243F" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">1</text>
  <text x="92" y="184" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Loop</text>
  <text x="220" y="184" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Ask, act, and stop</text>
  <circle cx="56" cy="256" r="18" fill="#FFE0B0"/>
  <text x="56" y="262" text-anchor="middle" fill="#10243F" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">2</text>
  <text x="92" y="264" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Tool</text>
  <text x="220" y="264" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">One action it may take</text>
  <circle cx="56" cy="336" r="18" fill="#FF9A2E"/>
  <text x="56" y="342" text-anchor="middle" fill="#10243F" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">3</text>
  <text x="92" y="344" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Notes</text>
  <text x="220" y="344" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">A file the next run opens</text>
  <circle cx="56" cy="416" r="18" fill="#F5A31A"/>
  <text x="56" y="422" text-anchor="middle" fill="#10243F" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">4</text>
  <text x="92" y="424" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Skill</text>
  <text x="220" y="424" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">The steps, saved in a file</text>
  <circle cx="56" cy="496" r="18" fill="#FFE0B0"/>
  <text x="56" y="502" text-anchor="middle" fill="#10243F" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">5</text>
  <text x="92" y="504" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Check</text>
  <text x="220" y="504" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">You accept the answer</text>
</svg>
