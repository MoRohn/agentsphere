<svg xmlns="http://www.w3.org/2000/svg" width="830" height="660" viewBox="0 0 830 660" role="img" aria-labelledby="title desc">
  <title id="title">The agent landscape</title>
  <desc id="desc">Foundations, harness, memory, tools, orchestration, evals, security, runtime.</desc>
  <defs>
    <linearGradient id="landscape-dark-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A31A"/>
      <stop offset="1" stop-color="#FFE0B0"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">The agent landscape</text>
  <text x="40" y="96" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">One harness. The rest of the guide hangs off it.</text>
  <g transform="translate(728.00,8.00) scale(0.3438)">
<circle cx="128" cy="128" r="118" fill="none" stroke="#F5A31A" stroke-opacity="0.22" stroke-width="12"/>
<circle cx="128" cy="128" r="110" fill="none" stroke="#F5A31A" stroke-opacity="0.45" stroke-width="7"/>
<circle cx="128" cy="128" r="100" fill="#10243F"/>
<circle cx="128" cy="128" r="96" fill="none" stroke="#F5A31A" stroke-width="6"/>
<g transform="translate(128,138)"><rect x="-38" y="-34" width="76" height="70" rx="34" fill="#FFFFFF"/><line x1="0" y1="-32" x2="0" y2="-50" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="0" y1="-32" x2="0" y2="-50" stroke="#F5A31A" stroke-width="4.4" stroke-linecap="round"/><circle cx="0" cy="-57" r="8.2" fill="#FFFFFF"/><circle cx="0" cy="-57" r="5.5" fill="#F5A31A"/><rect x="-26" y="-8" width="52" height="26" rx="13" fill="#10243F"/><circle cx="-12" cy="5" r="5.5" fill="#F5A31A"/><circle cx="12" cy="5" r="5.5" fill="#F5A31A"/><g fill="none" stroke="#F5A31A" stroke-width="2.6" stroke-linecap="round"><path d="M 34,-12 H 54"/><path d="M 36,0 H 62"/><path d="M 34,12 H 50"/></g><g fill="#F5A31A"><circle cx="56" cy="-12" r="2.5"/><circle cx="64" cy="0" r="2.5"/><circle cx="52" cy="12" r="2.5"/></g></g>
  </g>
  <line x1="40" y1="124" x2="700" y2="124" stroke="#30363D" stroke-width="1.5"/>
  <text x="40" y="160" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Foundations</text>
  <text x="40" y="192" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">What an agent is, and the loop it runs.</text>
  <text x="40" y="250" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Harness</text>
  <text x="40" y="282" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Observation, context, control, action, state, verification.</text>
  <text x="40" y="340" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Memory and tools</text>
  <text x="40" y="372" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Wiki, write-back, MCP, and skills.</text>
  <text x="40" y="430" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Orchestration</text>
  <text x="40" y="462" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A lead, phases, and a merge.</text>
  <text x="40" y="520" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Judge the run</text>
  <text x="40" y="552" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Evals, security, and where it runs.</text>
  <text x="40" y="620" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Playbooks practice a slice. The harness explains the rest.</text>
</svg>
