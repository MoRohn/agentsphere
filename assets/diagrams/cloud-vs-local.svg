<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Local and cloud agents</title>
  <desc id="desc">Side by side topologies. Local agents run on the developer machine. Cloud agents run the task in a remote environment.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="#0B0F1A"/>
  <rect width="960" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="36" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="33.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="36" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="30.2" r="1.7" fill="#7AF6FF"/>
  <text x="54" y="41" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Where the agent runs</text>
  <text x="928" y="41" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="28" y="76" width="430" height="470" rx="18" fill="#101628" stroke="#00D1FF" stroke-opacity="0.5"/>
    <text x="52" y="112" fill="#00D1FF" font-size="13" letter-spacing="1.6">LOCAL</text>
    <text x="52" y="144" fill="#E6EAF2" font-size="22" font-weight="600">On your machine</text>
    <text x="52" y="172" fill="#A9B4CC" font-size="14">The loop shares your process and files.</text>

    <rect x="52" y="198" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="72" y="224" fill="#E6EAF2" font-size="15" font-weight="600">IDE or terminal</text>
    <text x="72" y="244" fill="#8B97B3" font-size="13">You are in the loop with the agent.</text>
    <rect x="52" y="270" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="72" y="296" fill="#E6EAF2" font-size="15" font-weight="600">Keys on the machine</text>
    <text x="72" y="316" fill="#8B97B3" font-size="13">Each seat often has its own license.</text>
    <rect x="52" y="342" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="72" y="368" fill="#E6EAF2" font-size="15" font-weight="600">Short, interactive runs</text>
    <text x="72" y="388" fill="#8B97B3" font-size="13">Fast feedback. Work stops when you do.</text>
    <rect x="52" y="420" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="72" y="446" fill="#E6EAF2" font-size="15" font-weight="600">Private by default</text>
    <text x="72" y="466" fill="#8B97B3" font-size="13">Code and secrets stay in your environment.</text>
    <text x="52" y="516" fill="#8B97B3" font-size="13">Examples named in posts: Codex, Claude Code.</text>

    <rect x="502" y="76" width="430" height="470" rx="18" fill="#101628" stroke="#2EF2A6" stroke-opacity="0.5"/>
    <text x="526" y="112" fill="#2EF2A6" font-size="13" letter-spacing="1.6">CLOUD</text>
    <text x="526" y="144" fill="#E6EAF2" font-size="22" font-weight="600">On a remote run</text>
    <text x="526" y="172" fill="#A9B4CC" font-size="14">You hand off a task. The run continues.</text>

    <rect x="526" y="198" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="546" y="224" fill="#E6EAF2" font-size="15" font-weight="600">Task, not a seat</text>
    <text x="546" y="244" fill="#8B97B3" font-size="13">The team shares the agent, not a license file.</text>
    <rect x="526" y="270" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="546" y="296" fill="#E6EAF2" font-size="15" font-weight="600">Remote environment</text>
    <text x="546" y="316" fill="#8B97B3" font-size="13">Repo, tools, and logs live with the run.</text>
    <rect x="526" y="342" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="546" y="368" fill="#E6EAF2" font-size="15" font-weight="600">Long-running work</text>
    <text x="546" y="388" fill="#8B97B3" font-size="13">Branch, checks, and a reviewable result.</text>
    <rect x="526" y="420" width="382" height="58" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="546" y="446" fill="#E6EAF2" font-size="15" font-weight="600">Needs an audit trail</text>
    <text x="546" y="466" fill="#8B97B3" font-size="13">Who started it, what it touched, what landed.</text>
    <text x="526" y="516" fill="#8B97B3" font-size="13">Named per post: Devin, Amp, Factory.</text>

    <text x="480" y="310" text-anchor="middle" fill="#6C5CE7" font-size="14" font-weight="700">or</text>
  </g>
  <text x="28" y="612" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Topologies are established. The claim that per-seat local licenses fall behind cloud agents is per post, B10.</text>
</svg>
