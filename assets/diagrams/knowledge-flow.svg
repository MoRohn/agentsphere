<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How a research agent keeps what it learns</title>
  <desc id="desc">Six moves: name the question, search notes, read sources, write the page back, reflect, and let the next run start from that page.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="78%" r="42%">
      <stop offset="0" stop-color="#2EF2A6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="680" fill="#07090F"/>
  <rect width="1200" height="680" fill="url(#glow)"/>
  <rect width="1200" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="40" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="37.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="40" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="34.2" r="1.7" fill="#7AF6FF"/>
  <text x="56" y="46" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">How a research agent keeps what it learns</text>
  <text x="1164" y="46" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="28" y="84" width="176" height="248" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.85"/>
    <circle cx="56" cy="118" r="14" fill="#00D1FF"/>
    <text x="56" y="123" text-anchor="middle" fill="#07090F" font-size="13" font-weight="700">1</text>
    <text x="80" y="124" fill="#E6EAF2" font-size="16" font-weight="600">Question</text>
    <text x="48" y="162" fill="#A9B4CC" font-size="13">Name the decision</text>
    <text x="48" y="182" fill="#A9B4CC" font-size="13">and when to stop.</text>
    <text x="48" y="214" fill="#7AF6FF" font-size="12">The run needs an end.</text>
    <text x="48" y="292" fill="#8B97B3" font-size="11">WRITES THE GOAL</text>

    <rect x="220" y="84" width="176" height="248" rx="16" fill="#12182B" stroke="#6C5CE7"/>
    <circle cx="248" cy="118" r="14" fill="#6C5CE7"/>
    <text x="248" y="123" text-anchor="middle" fill="#F4F7FB" font-size="13" font-weight="700">2</text>
    <text x="272" y="124" fill="#E6EAF2" font-size="16" font-weight="600">Notes</text>
    <text x="240" y="162" fill="#A9B4CC" font-size="13">Open pages and</text>
    <text x="240" y="182" fill="#A9B4CC" font-size="13">past traces first.</text>
    <text x="240" y="214" fill="#C4B8FF" font-size="12">Do not redo the work.</text>
    <text x="240" y="292" fill="#8B97B3" font-size="11">READS MEMORY</text>

    <rect x="412" y="84" width="176" height="248" rx="16" fill="#12182B" stroke="#E6EAF2" stroke-opacity="0.35"/>
    <circle cx="440" cy="118" r="14" fill="#E6EAF2"/>
    <text x="440" y="123" text-anchor="middle" fill="#07090F" font-size="13" font-weight="700">3</text>
    <text x="464" y="124" fill="#E6EAF2" font-size="16" font-weight="600">Sources</text>
    <text x="432" y="162" fill="#A9B4CC" font-size="13">Papers, docs, posts.</text>
    <text x="432" y="182" fill="#A9B4CC" font-size="13">Leave them intact.</text>
    <text x="432" y="214" fill="#E6EAF2" font-size="12">A claim needs a URL.</text>
    <text x="432" y="292" fill="#8B97B3" font-size="11">READS EVIDENCE</text>

    <rect x="604" y="84" width="176" height="248" rx="16" fill="#12182B" stroke="#2EF2A6" stroke-opacity="0.9"/>
    <circle cx="632" cy="118" r="14" fill="#2EF2A6"/>
    <text x="632" y="123" text-anchor="middle" fill="#07090F" font-size="13" font-weight="700">4</text>
    <text x="656" y="124" fill="#E6EAF2" font-size="16" font-weight="600">Write back</text>
    <text x="624" y="162" fill="#A9B4CC" font-size="13">Answer, evidence,</text>
    <text x="624" y="182" fill="#A9B4CC" font-size="13">and the open gap.</text>
    <text x="624" y="214" fill="#7DFFC8" font-size="12">The next run is cheaper.</text>
    <text x="624" y="292" fill="#8B97B3" font-size="11">WRITES A PAGE</text>

    <rect x="796" y="84" width="176" height="248" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.55"/>
    <circle cx="824" cy="118" r="14" fill="#00D1FF" fill-opacity="0.9"/>
    <text x="824" y="123" text-anchor="middle" fill="#07090F" font-size="13" font-weight="700">5</text>
    <text x="848" y="124" fill="#E6EAF2" font-size="16" font-weight="600">Reflect</text>
    <text x="816" y="162" fill="#A9B4CC" font-size="13">What to repeat,</text>
    <text x="816" y="182" fill="#A9B4CC" font-size="13">correct, or drop.</text>
    <text x="816" y="214" fill="#7AF6FF" font-size="12">A note the next run uses.</text>
    <text x="816" y="292" fill="#8B97B3" font-size="11">WRITES A RULE</text>

    <rect x="988" y="84" width="184" height="248" rx="16" fill="#10241C" stroke="#2EF2A6"/>
    <circle cx="1016" cy="118" r="14" fill="#2EF2A6"/>
    <text x="1016" y="123" text-anchor="middle" fill="#07090F" font-size="13" font-weight="700">6</text>
    <text x="1040" y="124" fill="#E6EAF2" font-size="16" font-weight="600">Next run</text>
    <text x="1008" y="162" fill="#A9B4CC" font-size="13">Start on the page,</text>
    <text x="1008" y="182" fill="#A9B4CC" font-size="13">not in the old chat.</text>
    <text x="1008" y="214" fill="#7DFFC8" font-size="12">Memory compounds.</text>
    <text x="1008" y="292" fill="#8B97B3" font-size="11">SEARCHES NOTES</text>

    <polyline points="204,208 220,208" fill="none" stroke="#6C5CE7" stroke-width="1.6"/>
    <polygon points="214,202 224,208 214,214" fill="#6C5CE7"/>
    <polyline points="396,208 412,208" fill="none" stroke="#8B97B3" stroke-width="1.6"/>
    <polygon points="406,202 416,208 406,214" fill="#8B97B3"/>
    <polyline points="588,208 604,208" fill="none" stroke="#2EF2A6" stroke-width="1.6"/>
    <polygon points="598,202 608,208 598,214" fill="#2EF2A6"/>
    <polyline points="780,208 796,208" fill="none" stroke="#00D1FF" stroke-width="1.6"/>
    <polygon points="790,202 800,208 790,214" fill="#00D1FF"/>
    <polyline points="972,208 988,208" fill="none" stroke="#2EF2A6" stroke-width="1.6"/>
    <polygon points="982,202 992,208 982,214" fill="#2EF2A6"/>

    <path d="M1080 332 C1080 392 116 392 116 340" fill="none" stroke="#2EF2A6" stroke-width="1.6"/>
    <polygon points="110,348 116,332 122,348" fill="#2EF2A6"/>

    <rect x="188" y="430" width="824" height="132" rx="18" fill="#10241C" stroke="#2EF2A6" stroke-opacity="0.85"/>
    <text x="600" y="478" text-anchor="middle" fill="#E6EAF2" font-size="20" font-weight="600">Write it down, or the next run starts from zero</text>
    <text x="600" y="510" text-anchor="middle" fill="#A9B4CC" font-size="14">Search the page first. Open a source only for the gap. Then forget on purpose.</text>
    <text x="600" y="536" text-anchor="middle" fill="#8B97B3" font-size="13">Working memory is the window. Notes and skills are what outlive it.</text>
  </g>
  <text x="36" y="620" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">A fetched passage is not a memory until something writes the conclusion down.</text>
  <text x="36" y="652" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Research loop. What this run writes is what the next run can search.</text>
</svg>
