<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">The agent loop</title>
  <desc id="desc">Perceive, plan, act, observe, and remember, then continue or stop.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="#0B0F1A"/>
  <rect width="960" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="36" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="33.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="36" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="30.2" r="1.7" fill="#7AF6FF"/>
  <text x="54" y="41" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">The agent loop</text>
  <text x="928" y="41" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="36" y="84" width="200" height="108" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.85"/>
    <circle cx="64" cy="112" r="12" fill="#00D1FF"/>
    <text x="64" y="116" text-anchor="middle" fill="#0B0F1A" font-size="12" font-weight="700">1</text>
    <text x="84" y="116" fill="#E6EAF2" font-size="16" font-weight="600">Perceive</text>
    <text x="52" y="148" fill="#A9B4CC" font-size="13">Goal, context, and</text>
    <text x="52" y="168" fill="#A9B4CC" font-size="13">what just happened.</text>

    <rect x="268" y="84" width="200" height="108" rx="16" fill="#12182B" stroke="#6C5CE7"/>
    <circle cx="296" cy="112" r="12" fill="#6C5CE7"/>
    <text x="296" y="116" text-anchor="middle" fill="#E6EAF2" font-size="12" font-weight="700">2</text>
    <text x="316" y="116" fill="#E6EAF2" font-size="16" font-weight="600">Plan</text>
    <text x="284" y="148" fill="#A9B4CC" font-size="13">Choose the next</text>
    <text x="284" y="168" fill="#A9B4CC" font-size="13">step, not the novel.</text>

    <rect x="500" y="84" width="200" height="108" rx="16" fill="#12182B" stroke="#2EF2A6" stroke-opacity="0.9"/>
    <circle cx="528" cy="112" r="12" fill="#2EF2A6"/>
    <text x="528" y="116" text-anchor="middle" fill="#0B0F1A" font-size="12" font-weight="700">3</text>
    <text x="548" y="116" fill="#E6EAF2" font-size="16" font-weight="600">Act</text>
    <text x="516" y="148" fill="#A9B4CC" font-size="13">Call a tool, or</text>
    <text x="516" y="168" fill="#A9B4CC" font-size="13">write an artifact.</text>

    <rect x="732" y="84" width="192" height="108" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.65"/>
    <circle cx="760" cy="112" r="12" fill="#00D1FF"/>
    <text x="760" y="116" text-anchor="middle" fill="#0B0F1A" font-size="12" font-weight="700">4</text>
    <text x="780" y="116" fill="#E6EAF2" font-size="16" font-weight="600">Observe</text>
    <text x="748" y="148" fill="#A9B4CC" font-size="13">Read the tool</text>
    <text x="748" y="168" fill="#A9B4CC" font-size="13">result or error.</text>

    <polyline points="236,138 268,138" fill="none" stroke="#6C5CE7" stroke-width="1.6"/>
    <polygon points="260,132 272,138 260,144" fill="#6C5CE7"/>
    <polyline points="468,138 500,138" fill="none" stroke="#2EF2A6" stroke-width="1.6"/>
    <polygon points="492,132 504,138 492,144" fill="#2EF2A6"/>
    <polyline points="700,138 732,138" fill="none" stroke="#00D1FF" stroke-width="1.6"/>
    <polygon points="724,132 736,138 724,144" fill="#00D1FF"/>

    <rect x="120" y="292" width="320" height="120" rx="16" fill="#12182B" stroke="#6C5CE7"/>
    <circle cx="152" cy="328" r="12" fill="#6C5CE7"/>
    <text x="152" y="332" text-anchor="middle" fill="#E6EAF2" font-size="12" font-weight="700">5</text>
    <text x="176" y="332" fill="#E6EAF2" font-size="16" font-weight="600">Remember</text>
    <text x="148" y="364" fill="#A9B4CC" font-size="14">Write a note worth keeping.</text>
    <text x="148" y="386" fill="#A9B4CC" font-size="14">A page the next run can open.</text>

    <rect x="520" y="292" width="320" height="120" rx="16" fill="#12182B" stroke="#2EF2A6"/>
    <circle cx="552" cy="328" r="12" fill="#2EF2A6"/>
    <text x="552" y="332" text-anchor="middle" fill="#0B0F1A" font-size="12" font-weight="700">6</text>
    <text x="576" y="332" fill="#E6EAF2" font-size="16" font-weight="600">Stop, or loop</text>
    <text x="548" y="364" fill="#A9B4CC" font-size="14">Done when the goal is met.</text>
    <text x="548" y="386" fill="#A9B4CC" font-size="14">Otherwise return to plan.</text>

    <path d="M828 192 C828 250 760 250 760 292" fill="none" stroke="#8B97B3" stroke-width="1.5"/>
    <polygon points="754,280 760,294 766,280" fill="#8B97B3"/>
    <path d="M120 352 C48 352 48 138 120 138" fill="none" stroke="#00D1FF" stroke-width="1.6"/>
    <polygon points="112,132 124,138 112,144" fill="#00D1FF"/>
    <text x="28" y="250" fill="#00D1FF" font-size="12" transform="rotate(-90 28 250)">continue</text>

    <rect x="36" y="460" width="888" height="120" rx="16" fill="#101628" stroke="#1C2740"/>
    <text x="60" y="498" fill="#E6EAF2" font-size="16" font-weight="600">What sits outside the weights</text>
    <text x="60" y="528" fill="#A9B4CC" font-size="14">The model chooses the next step. Tools do the work. Memory holds what should survive the chat.</text>
    <text x="60" y="552" fill="#A9B4CC" font-size="14">A stop rule ends the loop when the goal is met, or when the budget is spent.</text>
  </g>
  <text x="36" y="618" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Established pattern. See docs/00-foundations/the-agent-loop.md</text>
</svg>
