<svg xmlns="http://www.w3.org/2000/svg" width="830" height="356" viewBox="0 0 830 356" role="img" aria-labelledby="title desc">
  <title id="title">Four levels, one path</title>
  <desc id="desc">Explorer, Builder, Operator, and Power user.</desc>
  <defs>
    <linearGradient id="journey-map-light-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10243F"/>
      <stop offset="1" stop-color="#F5A31A"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Four levels, one path</text>
  
  <text x="40" y="96" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Stop at the end of a level and you still have a skill.</text>
  <line x1="40" y1="128" x2="700" y2="128" stroke="#D0D7DE" stroke-width="1.5"/>
  <circle cx="48" cy="148" r="7" fill="#F5A31A"/>
  <text x="68" y="156" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Explorer</text>
  <text x="68" y="186" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Leave with a card.</text>
  <circle cx="438" cy="148" r="7" fill="#10243F"/>
  <text x="458" y="156" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Builder</text>
  <text x="458" y="186" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Leave with a page.</text>
  <circle cx="48" cy="240" r="7" fill="#C96E00"/>
  <text x="68" y="248" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Operator</text>
  <text x="68" y="278" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Leave with a score.</text>
  <circle cx="438" cy="240" r="7" fill="#F5A31A"/>
  <text x="458" y="248" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Power user</text>
  <text x="458" y="278" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Leave with a page edit.</text>
</svg>
