<svg xmlns="http://www.w3.org/2000/svg" width="830" height="276" viewBox="0 0 830 276" role="img" aria-labelledby="title desc">
  <title id="title">Where the run lives</title>
  <desc id="desc">Local agents and cloud agents.</desc>
  <defs>
    <linearGradient id="cloud-vs-local-dark-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A31A"/>
      <stop offset="1" stop-color="#FFE0B0"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Where the run lives</text>
  
  <text x="40" y="96" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Same loop. Different machine.</text>
  <line x1="40" y1="128" x2="700" y2="128" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="50.0" cy="164" r="8" fill="#F5A31A"/>
  <text x="40.0" y="208" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Local</text>
  <text x="40.0" y="238" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Your files and keys.</text>
  <line x1="68.0" y1="164" x2="291.33333333333337" y2="164" stroke="#30363D" stroke-width="2"/>
  <circle cx="309.33333333333337" cy="164" r="8" fill="#FFE0B0"/>
  <text x="299.33333333333337" y="208" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Cloud</text>
  <text x="299.33333333333337" y="238" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A remote machine.</text>
  <line x1="327.33333333333337" y1="164" x2="550.6666666666667" y2="164" stroke="#30363D" stroke-width="2"/>
  <circle cx="568.6666666666667" cy="164" r="8" fill="#FF9A2E"/>
  <text x="558.6666666666667" y="208" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Handoff</text>
  <text x="558.6666666666667" y="238" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Who can see what.</text>
</svg>
