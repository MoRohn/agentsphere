<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Gateway routing</title>
  <desc id="desc">Clients call one OpenAI-compatible endpoint. A local gateway routes across providers and falls back when a provider returns 429 or runs out of quota.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="700" fill="#0B0F1A"/>
  <rect width="960" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="36" r="8" fill="none" stroke="#00D1FF" stroke-width="1.4"/>
  <circle cx="36" cy="36" r="2.5" fill="#6C5CE7"/>
  <text x="54" y="41" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Local model gateway</text>
  <text x="928" y="41" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="84" fill="#00D1FF" font-size="12" letter-spacing="1.5">CLIENTS</text>
    <rect x="28" y="98" width="200" height="44" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="128" y="126" text-anchor="middle" fill="#E6EAF2" font-size="14">Cursor</text>
    <rect x="28" y="154" width="200" height="44" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="128" y="182" text-anchor="middle" fill="#E6EAF2" font-size="14">VS Code</text>
    <rect x="28" y="210" width="200" height="44" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="128" y="238" text-anchor="middle" fill="#E6EAF2" font-size="14">Claude Code</text>
    <rect x="28" y="266" width="200" height="44" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="128" y="294" text-anchor="middle" fill="#E6EAF2" font-size="14">Custom scripts</text>
    <text x="128" y="336" text-anchor="middle" fill="#8B97B3" font-size="12">One client API</text>

    <polyline points="228,186 268,186" fill="none" stroke="#6C5CE7" stroke-width="1.6"/>
    <polygon points="260,180 274,186 260,192" fill="#6C5CE7"/>

    <rect x="276" y="78" width="360" height="460" rx="18" fill="#101628" stroke="#6C5CE7"/>
    <text x="300" y="112" fill="#6C5CE7" font-size="12" letter-spacing="1.5">LOCAL GATEWAY</text>
    <text x="300" y="142" fill="#E6EAF2" font-size="18" font-weight="600">OpenAI-compatible</text>
    <text x="300" y="164" fill="#A9B4CC" font-size="13">Single endpoint. Per post, B6.</text>

    <rect x="300" y="186" width="312" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="316" y="212" fill="#E6EAF2" font-size="14" font-weight="600">Router</text>
    <text x="316" y="232" fill="#A9B4CC" font-size="13">18 strategies claimed. Not listed here.</text>

    <rect x="300" y="262" width="312" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="316" y="288" fill="#E6EAF2" font-size="14" font-weight="600">Fallback</text>
    <text x="316" y="308" fill="#A9B4CC" font-size="13">On HTTP 429 or quota, try the next.</text>

    <rect x="300" y="338" width="312" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="316" y="364" fill="#E6EAF2" font-size="14" font-weight="600">Context compression</text>
    <text x="316" y="384" fill="#A9B4CC" font-size="13">RTK + Caveman, 15-95% claimed.</text>

    <rect x="300" y="414" width="312" height="96" rx="12" fill="#12182B" stroke="#2EF2A6" stroke-opacity="0.45"/>
    <text x="316" y="442" fill="#E6EAF2" font-size="14" font-weight="600">Keys stay local</text>
    <text x="316" y="464" fill="#A9B4CC" font-size="13">AES-256-GCM claimed. 0 telemetry claimed.</text>
    <text x="316" y="486" fill="#8B97B3" font-size="12">Claims, not an audit.</text>

    <polyline points="636,300 676,300" fill="none" stroke="#2EF2A6" stroke-width="1.6"/>
    <polygon points="668,294 682,300 668,306" fill="#2EF2A6"/>

    <text x="700" y="84" fill="#2EF2A6" font-size="12" letter-spacing="1.5">PROVIDERS</text>
    <rect x="692" y="98" width="240" height="36" rx="10" fill="#12182B" stroke="#1C2740"/>
    <text x="708" y="122" fill="#E6EAF2" font-size="13">Google AI Studio</text>
    <rect x="692" y="142" width="240" height="36" rx="10" fill="#12182B" stroke="#1C2740"/>
    <text x="708" y="166" fill="#E6EAF2" font-size="13">Groq</text>
    <rect x="692" y="186" width="240" height="36" rx="10" fill="#12182B" stroke="#1C2740"/>
    <text x="708" y="210" fill="#E6EAF2" font-size="13">Cerebras</text>
    <rect x="692" y="230" width="240" height="36" rx="10" fill="#12182B" stroke="#1C2740"/>
    <text x="708" y="254" fill="#E6EAF2" font-size="13">SambaNova</text>
    <rect x="692" y="274" width="240" height="36" rx="10" fill="#12182B" stroke="#1C2740"/>
    <text x="708" y="298" fill="#E6EAF2" font-size="13">OpenRouter</text>
    <rect x="692" y="318" width="240" height="36" rx="10" fill="#12182B" stroke="#1C2740"/>
    <text x="708" y="342" fill="#E6EAF2" font-size="13">GitHub Models</text>
    <rect x="692" y="362" width="240" height="36" rx="10" fill="#12182B" stroke="#1C2740"/>
    <text x="708" y="386" fill="#E6EAF2" font-size="13">Mistral AI</text>
    <rect x="692" y="406" width="240" height="36" rx="10" fill="#12182B" stroke="#2EF2A6" stroke-opacity="0.4"/>
    <text x="708" y="430" fill="#A9B4CC" font-size="13">+ more, 350+ claimed</text>

    <rect x="28" y="560" width="904" height="84" rx="16" fill="#1A1428" stroke="#6C5CE7" stroke-opacity="0.7"/>
    <text x="52" y="594" fill="#E6EAF2" font-size="15" font-weight="600">Read this before you point an IDE at it</text>
    <text x="52" y="618" fill="#A9B4CC" font-size="13">Free-tier pooling can break provider terms. "Leaked" and "800 million tokens" are the post's hype, not a grant of keys.</text>
  </g>
  <text x="28" y="676" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">All product claims on this diagram are per post, B6. HTTP 429 is a standard status code.</text>
</svg>
