<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The model proposes. The harness decides.</title>
  <desc id="desc">A foundation model sits inside a six-part execution harness: observation, context, control, action, state, and verification. A light travels the orbit.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="68%">
      <stop offset="0" stop-color="#F4FBFF"/>
      <stop offset="0.28" stop-color="#7AF6FF"/>
      <stop offset="0.62" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#1A1440"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00D1FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
    <style>
      .halo { animation: corepulse 3.6s ease-in-out infinite; }
      @keyframes corepulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#07090F"/>
  <rect width="1200" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="40" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="37.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="40" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="34.2" r="1.7" fill="#7AF6FF"/>
  <text x="56" y="46" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">The model proposes. The harness decides.</text>
  <text x="1164" y="46" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <ellipse cx="600" cy="390" rx="340" ry="150" fill="none" stroke="#1C2740" stroke-width="10"/>
    <ellipse cx="600" cy="390" rx="340" ry="150" fill="none" stroke="#2EF2A6" stroke-width="1.6" stroke-dasharray="7 11" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-216" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <circle class="halo" cx="600" cy="390" r="118" fill="url(#halo)"/>
    <circle cx="600" cy="390" r="58" fill="url(#core)"/>
    <circle cx="600" cy="390" r="58" fill="none" stroke="#9AF7FF" stroke-width="1.4"/>
    <circle cx="578" cy="368" r="10" fill="#FFFFFF" fill-opacity="0.7"/>
    <text x="600" y="386" text-anchor="middle" fill="#F4F7FB" font-size="13" font-weight="700">MODEL</text>
    <text x="600" y="404" text-anchor="middle" fill="#D5F8FF" font-size="11">proposes</text>

    <circle cx="600" cy="240" r="16" fill="#00D1FF"/>
    <text x="600" y="208" text-anchor="middle" fill="#7AF6FF" font-size="13" font-weight="600">1  Observation</text>
    <text x="600" y="188" text-anchor="middle" fill="#8B97B3" font-size="12">what it can see</text>

    <circle cx="894" cy="315" r="16" fill="#6C5CE7"/>
    <text x="920" y="310" fill="#C4B8FF" font-size="13" font-weight="600">2  Context</text>
    <text x="920" y="328" fill="#8B97B3" font-size="12">what enters this call</text>

    <circle cx="894" cy="465" r="16" fill="#6C5CE7"/>
    <text x="920" y="460" fill="#C4B8FF" font-size="13" font-weight="600">3  Control</text>
    <text x="920" y="478" fill="#8B97B3" font-size="12">plan, act, retry, stop</text>

    <circle cx="600" cy="540" r="16" fill="#00D1FF"/>
    <text x="600" y="576" text-anchor="middle" fill="#7AF6FF" font-size="13" font-weight="600">4  Action</text>
    <text x="600" y="594" text-anchor="middle" fill="#8B97B3" font-size="12">what it may do</text>

    <circle cx="306" cy="465" r="16" fill="#2EF2A6"/>
    <text x="284" y="460" text-anchor="end" fill="#7DFFC8" font-size="13" font-weight="600">5  State</text>
    <text x="284" y="478" text-anchor="end" fill="#8B97B3" font-size="12">what outlives the call</text>

    <circle cx="306" cy="315" r="16" fill="#2EF2A6"/>
    <text x="284" y="310" text-anchor="end" fill="#7DFFC8" font-size="13" font-weight="600">6  Verification</text>
    <text x="284" y="328" text-anchor="end" fill="#8B97B3" font-size="12">what holds the run</text>

    <circle r="5" fill="#F4FBFF">
      <animateMotion dur="14s" repeatCount="indefinite" path="M940,390 A340,150 0 1,1 260,390 A340,150 0 1,1 940,390"/>
    </circle>
  </g>
  <text x="36" y="652" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Same model. Different harness. Different agent.</text>
  <text x="36" y="680" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Guo et al., 2026. The six parts are one runtime, not six separate tools.</text>
</svg>
