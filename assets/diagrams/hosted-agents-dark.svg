<svg xmlns="http://www.w3.org/2000/svg" width="830" height="448" viewBox="0 0 830 448" role="img" aria-labelledby="title desc">
  <title id="title">Hosted agents</title>
  <desc id="desc">Grok Bot, Muse, Dots, Claude Cowork, and Copilot Studio computer use.</desc>
  <defs>
    <linearGradient id="hosted-agents-dark-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A31A"/>
      <stop offset="1" stop-color="#FFE0B0"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Hosted agents</text>
  
  <text x="40" y="96" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">October 2026. A computer, a memory, and a gate.</text>
  <line x1="40" y1="128" x2="700" y2="128" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="48" cy="148" r="7" fill="#F5A31A"/>
  <text x="68" y="156" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Grok Bot</text>
  <text x="68" y="186" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">xAI. Bots share one cloud computer.</text>
  <circle cx="438" cy="148" r="7" fill="#FFE0B0"/>
  <text x="458" y="156" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Muse</text>
  <text x="458" y="186" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Meta. One person, one secure VM.</text>
  <circle cx="48" cy="240" r="7" fill="#FF9A2E"/>
  <text x="68" y="248" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Dots</text>
  <text x="68" y="278" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">OpenAI. One primary dot, in ChatGPT.</text>
  <circle cx="438" cy="240" r="7" fill="#F5A31A"/>
  <text x="458" y="248" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Claude</text>
  <text x="458" y="278" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Anthropic. Cloud task. Local screen.</text>
  <circle cx="48" cy="332" r="7" fill="#FFE0B0"/>
  <text x="68" y="340" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Copilot Studio</text>
  <text x="68" y="370" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Microsoft. You assign the machine.</text>
</svg>
