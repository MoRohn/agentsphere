<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Four levels, one path</title>
  <desc id="desc">Explorer, Builder, Operator, and Power user. Each level ends with something you can show.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="#07090F"/>
  <rect width="1200" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="40" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="37.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="40" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="34.2" r="1.7" fill="#7AF6FF"/>
  <text x="56" y="46" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Four levels, one path</text>
  <text x="1164" y="46" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M150 168 C 280 168, 300 168, 430 168 S 620 168, 750 168 S 900 168, 1050 168" fill="none" stroke="#2EF2A6" stroke-width="2" stroke-dasharray="6 8" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-84" dur="6s" repeatCount="indefinite"/>
    </path>
    <rect x="28" y="96" width="250" height="168" rx="16" fill="#12182B" stroke="#00D1FF"/>
    <circle cx="56" cy="132" r="12" fill="#00D1FF"/>
    <text x="56" y="136" text-anchor="middle" fill="#07090F" font-size="12" font-weight="700">1</text>
    <text x="78" y="136" fill="#E6EAF2" font-size="16" font-weight="600">Explorer</text>
    <text x="48" y="172" fill="#A9B4CC" font-size="13">Name an agent.</text>
    <text x="48" y="194" fill="#A9B4CC" font-size="13">Point at the harness.</text>
    <text x="48" y="230" fill="#7AF6FF" font-size="12">LEAVE WITH A CARD</text>
    <rect x="318" y="96" width="250" height="168" rx="16" fill="#12182B" stroke="#6C5CE7"/>
    <circle cx="346" cy="132" r="12" fill="#6C5CE7"/>
    <text x="346" y="136" text-anchor="middle" fill="#F4F7FB" font-size="12" font-weight="700">2</text>
    <text x="368" y="136" fill="#E6EAF2" font-size="16" font-weight="600">Builder</text>
    <text x="338" y="172" fill="#A9B4CC" font-size="13">Memory, tools, skills.</text>
    <text x="338" y="194" fill="#A9B4CC" font-size="13">Design the six parts.</text>
    <text x="338" y="230" fill="#C4B8FF" font-size="12">LEAVE WITH A PAGE</text>
    <rect x="608" y="96" width="250" height="168" rx="16" fill="#10241C" stroke="#2EF2A6"/>
    <circle cx="636" cy="132" r="12" fill="#2EF2A6"/>
    <text x="636" y="136" text-anchor="middle" fill="#07090F" font-size="12" font-weight="700">3</text>
    <text x="658" y="136" fill="#E6EAF2" font-size="16" font-weight="600">Operator</text>
    <text x="628" y="172" fill="#A9B4CC" font-size="13">Place the run.</text>
    <text x="628" y="194" fill="#A9B4CC" font-size="13">Score the harness.</text>
    <text x="628" y="230" fill="#7DFFC8" font-size="12">LEAVE WITH A SCORE</text>
    <rect x="898" y="96" width="274" height="168" rx="16" fill="#12182B" stroke="#E6EAF2" stroke-opacity="0.55"/>
    <circle cx="926" cy="132" r="12" fill="#E6EAF2"/>
    <text x="926" y="136" text-anchor="middle" fill="#07090F" font-size="12" font-weight="700">4</text>
    <text x="948" y="136" fill="#E6EAF2" font-size="16" font-weight="600">Power user</text>
    <text x="918" y="172" fill="#A9B4CC" font-size="13">Fix one thin step.</text>
    <text x="918" y="194" fill="#A9B4CC" font-size="13">Write it back.</text>
    <text x="918" y="230" fill="#E6EAF2" font-size="12">LEAVE WITH A PAGE EDIT</text>
  </g>
  <text x="36" y="312" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Stop at the end of a level and you still have a finished skill.</text>
  <text x="36" y="340" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Every level meets the harness. Explorer names it. Builder designs it. Operator scores it. Power user extends it.</text>
</svg>
