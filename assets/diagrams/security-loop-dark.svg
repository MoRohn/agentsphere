<svg xmlns="http://www.w3.org/2000/svg" width="830" height="436" viewBox="0 0 830 436" role="img" aria-labelledby="title desc">
  <title id="title">Find, review, fix, retest</title>
  <desc id="desc">Find, review, fix, retest.</desc>
  <defs>
    <linearGradient id="security-loop-dark-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A31A"/>
      <stop offset="1" stop-color="#FFE0B0"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Find, review, fix, retest</text>
  
  <text x="40" y="96" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A person stands between the finding and the change.</text>
  <line x1="40" y1="128" x2="700" y2="128" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="50.0" cy="182" r="8" fill="#F5A31A"/>
  <text x="40.0" y="220" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Find</text>
  <text x="40.0" y="250" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Name the issue.</text>
  <circle cx="439.0" cy="182" r="8" fill="#FFE0B0"/>
  <text x="429.0" y="220" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Review</text>
  <text x="429.0" y="250" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A person decides.</text>
  <circle cx="50.0" cy="292" r="8" fill="#FF9A2E"/>
  <text x="40.0" y="330" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Fix</text>
  <text x="40.0" y="360" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">The smallest change.</text>
  <circle cx="439.0" cy="292" r="8" fill="#F5A31A"/>
  <text x="429.0" y="330" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Retest</text>
  <text x="429.0" y="360" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Show it is gone.</text>
</svg>
