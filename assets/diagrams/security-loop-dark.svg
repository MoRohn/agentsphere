<svg xmlns="http://www.w3.org/2000/svg" width="830" height="436" viewBox="0 0 830 436" role="img" aria-labelledby="title desc">
  <title id="title">Find, review, fix, retest</title>
  <desc id="desc">Find, review, fix, retest.</desc>
  <defs>
    <linearGradient id="security-loop-dark-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A31A"/>
      <stop offset="1" stop-color="#FFE0B0"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Find, review, fix, retest</text>
  <g transform="translate(728.00,8.00) scale(0.3438)">
<circle cx="128" cy="128" r="118" fill="none" stroke="#F5A31A" stroke-opacity="0.22" stroke-width="12"/>
<circle cx="128" cy="128" r="110" fill="none" stroke="#F5A31A" stroke-opacity="0.45" stroke-width="7"/>
<circle cx="128" cy="128" r="100" fill="#10243F"/>
