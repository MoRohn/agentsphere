<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Find, review, fix, retest</title>
  <desc id="desc">A defensive loop: map the surface, probe, record findings, hold for human review, ship a fix, and test again.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="680" fill="#0B0F1A"/>
  <rect width="960" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="36" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="33.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="36" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="30.2" r="1.7" fill="#7AF6FF"/>
  <text x="54" y="41" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Find, review, fix, retest</text>
  <text x="928" y="41" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="36" y="84" width="200" height="100" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.8"/>
    <text x="56" y="120" fill="#00D1FF" font-size="12" letter-spacing="1.2">1</text>
    <text x="56" y="146" fill="#E6EAF2" font-size="16" font-weight="600">Map</text>
    <text x="56" y="168" fill="#A9B4CC" font-size="13">Name the surface.</text>

    <rect x="268" y="84" width="200" height="100" rx="16" fill="#12182B" stroke="#6C5CE7"/>
    <text x="288" y="120" fill="#6C5CE7" font-size="12" letter-spacing="1.2">2</text>
    <text x="288" y="146" fill="#E6EAF2" font-size="16" font-weight="600">Probe</text>
    <text x="288" y="168" fill="#A9B4CC" font-size="13">Look for weakness.</text>

    <rect x="500" y="84" width="200" height="100" rx="16" fill="#12182B" stroke="#E6EAF2" stroke-opacity="0.35"/>
    <text x="520" y="120" fill="#E6EAF2" font-size="12" letter-spacing="1.2">3</text>
    <text x="520" y="146" fill="#E6EAF2" font-size="16" font-weight="600">Findings</text>
    <text x="520" y="168" fill="#A9B4CC" font-size="13">Evidence, not noise.</text>

    <polyline points="236,134 268,134" fill="none" stroke="#6C5CE7" stroke-width="1.5"/>
    <polygon points="260,128 272,134 260,140" fill="#6C5CE7"/>
    <polyline points="468,134 500,134" fill="none" stroke="#8B97B3" stroke-width="1.5"/>
    <polygon points="492,128 504,134 492,140" fill="#8B97B3"/>

    <rect x="176" y="230" width="608" height="110" rx="18" fill="#10241C" stroke="#2EF2A6" stroke-width="1.6"/>
    <text x="200" y="268" fill="#2EF2A6" font-size="13" letter-spacing="1.4">4  ·  HUMAN REVIEW GATE</text>
    <text x="200" y="298" fill="#E6EAF2" font-size="18" font-weight="600">A person accepts the fix before it lands</text>
    <text x="200" y="322" fill="#A9B4CC" font-size="14">The agent proposes. The team decides. No silent patches.</text>

    <polyline points="600,184 600,210 480,210 480,230" fill="none" stroke="#2EF2A6" stroke-width="1.5"/>
    <polygon points="474,220 480,234 486,220" fill="#2EF2A6"/>

    <rect x="120" y="380" width="280" height="100" rx="16" fill="#12182B" stroke="#6C5CE7"/>
    <text x="144" y="416" fill="#6C5CE7" font-size="12" letter-spacing="1.2">5</text>
    <text x="144" y="442" fill="#E6EAF2" font-size="16" font-weight="600">Ship the fix</text>
    <text x="144" y="464" fill="#A9B4CC" font-size="13">A reviewable change.</text>

    <rect x="560" y="380" width="280" height="100" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.8"/>
    <text x="584" y="416" fill="#00D1FF" font-size="12" letter-spacing="1.2">6</text>
    <text x="584" y="442" fill="#E6EAF2" font-size="16" font-weight="600">Retest</text>
    <text x="584" y="464" fill="#A9B4CC" font-size="13">The finding should be gone.</text>

    <polyline points="400,460 560,460" fill="none" stroke="#00D1FF" stroke-width="1.5"/>
    <polygon points="552,454 564,460 552,466" fill="#00D1FF"/>
    <path d="M840 430 C900 300 860 200 736 184" fill="none" stroke="#00D1FF" stroke-opacity="0.7" stroke-width="1.4"/>
    <polygon points="742,178 728,186 744,192" fill="#00D1FF"/>
    <text x="812" y="300" fill="#00D1FF" font-size="12">retest again</text>

    <text x="36" y="524" fill="#8B97B3" font-size="12" letter-spacing="1.4">THREATS THIS GUIDE NAMES, WITHOUT PROCEDURES</text>
    <rect x="36" y="540" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="52" y="566" fill="#E6EAF2" font-size="14">Prompt injection</text>
    <text x="52" y="586" fill="#8B97B3" font-size="12">Untrusted text as orders</text>
    <rect x="262" y="540" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="278" y="566" fill="#E6EAF2" font-size="14">Secrets</text>
    <text x="278" y="586" fill="#8B97B3" font-size="12">Keys in prompts and logs</text>
    <rect x="488" y="540" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="504" y="566" fill="#E6EAF2" font-size="14">Over-broad tools</text>
    <text x="504" y="586" fill="#8B97B3" font-size="12">More power than the task</text>
    <rect x="714" y="540" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="730" y="566" fill="#E6EAF2" font-size="14">Untrusted skills</text>
    <text x="730" y="586" fill="#8B97B3" font-size="12">Install is code execution</text>
  </g>
  <text x="36" y="656" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Loop shape per post, from the Antigen post. This diagram has no exploit steps.</text>
</svg>
