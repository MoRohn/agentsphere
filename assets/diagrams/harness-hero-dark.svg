<svg xmlns="http://www.w3.org/2000/svg" width="830" height="560" viewBox="0 0 830 560" role="img" aria-labelledby="title desc">
  <title id="title">The harness decides</title>
  <desc id="desc">Six parts around the model.</desc>
  <defs>
    <linearGradient id="harness-hero-dark-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A31A"/>
      <stop offset="1" stop-color="#FFE0B0"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">The harness decides</text>
  <text x="40" y="92" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">The model only proposes the next step.</text>
  
  <ellipse cx="415" cy="300" rx="230" ry="96" fill="none" stroke="#F5A31A" stroke-width="2.5" stroke-dasharray="8 10"/>
  <circle cx="415" cy="300" r="58" fill="#10243F"/>
  <circle cx="415" cy="300" r="58" fill="none" stroke="#F5A31A" stroke-width="5"/>
  <text x="415" y="308" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Model</text>
  <text x="415" y="168" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Observation</text>
  <text x="700" y="250" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Context</text>
  <text x="700" y="360" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Control</text>
  <text x="415" y="448" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Action</text>
  <text x="176" y="360" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="end">State</text>
  <text x="176" y="250" fill="#E6EDF3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="end">Verification</text>
  <text x="40" y="520" fill="#C9D1D9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Same model. Different harness. Different agent.</text>
</svg>
