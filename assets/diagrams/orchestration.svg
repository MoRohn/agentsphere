<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Lead agent orchestration</title>
  <desc id="desc">A lead agent writes a phased plan. Workers run inside each phase. Results combine at the end.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="680" fill="#0B0F1A"/>
  <rect width="960" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="36" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="33.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="36" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="30.2" r="1.7" fill="#7AF6FF"/>
  <text x="54" y="41" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Lead agent, phased plan</text>
  <text x="928" y="41" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="300" y="78" width="360" height="88" rx="18" fill="#12182B" stroke="#6C5CE7" stroke-width="1.6"/>
    <circle cx="336" cy="122" r="14" fill="#6C5CE7"/>
    <circle cx="336" cy="122" r="4" fill="#E6EAF2"/>
    <text x="362" y="116" fill="#E6EAF2" font-size="18" font-weight="600">Lead agent</text>
    <text x="362" y="142" fill="#A9B4CC" font-size="14">Writes the plan. Does not do every task.</text>

    <polyline points="480,166 480,196" fill="none" stroke="#6C5CE7" stroke-width="1.6"/>
    <polygon points="474,188 480,202 486,188" fill="#6C5CE7"/>

    <rect x="80" y="204" width="800" height="44" rx="12" fill="#101628" stroke="#1C2740"/>
    <text x="480" y="232" text-anchor="middle" fill="#C5D0E4" font-size="14">One plan, split into phases. Later phases can use earlier results.</text>

    <rect x="36" y="272" width="280" height="236" rx="16" fill="#101628" stroke="#00D1FF" stroke-opacity="0.55"/>
    <text x="56" y="304" fill="#00D1FF" font-size="13" letter-spacing="1.4">PHASE 1</text>
    <text x="56" y="330" fill="#E6EAF2" font-size="16" font-weight="600">Map the work</text>
    <rect x="56" y="350" width="240" height="56" rx="12" fill="#12182B" stroke="#1C2740"/>
    <circle cx="80" cy="378" r="6" fill="#00D1FF"/>
    <text x="96" y="374" fill="#E6EAF2" font-size="13">Worker A · sources</text>
    <text x="96" y="392" fill="#8B97B3" font-size="12">gather, do not conclude</text>
    <rect x="56" y="418" width="240" height="56" rx="12" fill="#12182B" stroke="#1C2740"/>
    <circle cx="80" cy="446" r="6" fill="#00D1FF"/>
    <text x="96" y="442" fill="#E6EAF2" font-size="13">Worker B · constraints</text>
    <text x="96" y="460" fill="#8B97B3" font-size="12">scope and risks</text>

    <rect x="340" y="272" width="280" height="236" rx="16" fill="#101628" stroke="#6C5CE7" stroke-opacity="0.7"/>
    <text x="360" y="304" fill="#6C5CE7" font-size="13" letter-spacing="1.4">PHASE 2</text>
    <text x="360" y="330" fill="#E6EAF2" font-size="16" font-weight="600">Do the work</text>
    <rect x="360" y="350" width="240" height="56" rx="12" fill="#12182B" stroke="#1C2740"/>
    <circle cx="384" cy="378" r="6" fill="#6C5CE7"/>
    <text x="400" y="374" fill="#E6EAF2" font-size="13">Worker C · draft</text>
    <text x="400" y="392" fill="#8B97B3" font-size="12">one slice of the plan</text>
    <rect x="360" y="418" width="240" height="56" rx="12" fill="#12182B" stroke="#1C2740"/>
    <circle cx="384" cy="446" r="6" fill="#6C5CE7"/>
    <text x="400" y="442" fill="#E6EAF2" font-size="13">Worker D · draft</text>
    <text x="400" y="460" fill="#8B97B3" font-size="12">a different slice</text>

    <rect x="644" y="272" width="280" height="236" rx="16" fill="#101628" stroke="#2EF2A6" stroke-opacity="0.6"/>
    <text x="664" y="304" fill="#2EF2A6" font-size="13" letter-spacing="1.4">PHASE 3</text>
    <text x="664" y="330" fill="#E6EAF2" font-size="16" font-weight="600">Check the work</text>
    <rect x="664" y="350" width="240" height="56" rx="12" fill="#12182B" stroke="#1C2740"/>
    <circle cx="688" cy="378" r="6" fill="#2EF2A6"/>
    <text x="704" y="374" fill="#E6EAF2" font-size="13">Worker E · review</text>
    <text x="704" y="392" fill="#8B97B3" font-size="12">gaps and contradictions</text>
    <rect x="664" y="418" width="240" height="56" rx="12" fill="#12182B" stroke="#1C2740"/>
    <circle cx="688" cy="446" r="6" fill="#2EF2A6"/>
    <text x="704" y="442" fill="#E6EAF2" font-size="13">Worker F · tests</text>
    <text x="704" y="460" fill="#8B97B3" font-size="12">does the result hold</text>

    <polyline points="176,508 176,536 480,536" fill="none" stroke="#8B97B3" stroke-width="1.4"/>
    <polyline points="480,508 480,536" fill="none" stroke="#8B97B3" stroke-width="1.4"/>
    <polyline points="784,508 784,536 480,536" fill="none" stroke="#8B97B3" stroke-width="1.4"/>
    <polyline points="480,536 480,556" fill="none" stroke="#2EF2A6" stroke-width="1.5"/>
    <polygon points="474,548 480,562 486,548" fill="#2EF2A6"/>

    <rect x="180" y="564" width="600" height="64" rx="16" fill="#10241C" stroke="#2EF2A6"/>
    <text x="480" y="592" text-anchor="middle" fill="#E6EAF2" font-size="16" font-weight="600">Combine the results</text>
    <text x="480" y="614" text-anchor="middle" fill="#A9B4CC" font-size="13">The lead merges phase outputs into one deliverable.</text>
  </g>
  <text x="36" y="662" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Pattern per post, B4: Claude Managed Agents dynamic workflows, public beta. Worker names are illustrative.</text>
</svg>
