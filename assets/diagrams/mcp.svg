<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Tools and MCP</title>
  <desc id="desc">An agent host talks to a model API and, through an MCP client, to tool and data servers. Agents may also delegate to other agents.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="#0B0F1A"/>
  <rect width="960" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="36" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="33.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="36" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="30.2" r="1.7" fill="#7AF6FF"/>
  <text x="54" y="41" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Tools, MCP, and agent-to-agent</text>
  <text x="928" y="41" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="330" y="76" width="300" height="84" rx="16" fill="#12182B" stroke="#E6EAF2" stroke-opacity="0.4"/>
    <text x="480" y="110" text-anchor="middle" fill="#E6EAF2" font-size="18" font-weight="600">Agent host</text>
    <text x="480" y="136" text-anchor="middle" fill="#A9B4CC" font-size="13">The app a person actually uses</text>

    <polyline points="400,160 240,210" fill="none" stroke="#00D1FF" stroke-width="1.5"/>
    <polygon points="232,204 236,220 248,210" fill="#00D1FF"/>
    <polyline points="560,160 720,210" fill="none" stroke="#6C5CE7" stroke-width="1.5"/>
    <polygon points="712,200 732,214 714,220" fill="#6C5CE7"/>

    <rect x="36" y="214" width="300" height="120" rx="16" fill="#101628" stroke="#00D1FF" stroke-opacity="0.7"/>
    <text x="56" y="248" fill="#00D1FF" font-size="12" letter-spacing="1.4">MODEL API</text>
    <text x="56" y="278" fill="#E6EAF2" font-size="16" font-weight="600">The model</text>
    <text x="56" y="304" fill="#A9B4CC" font-size="13">Chooses the next step.</text>

    <rect x="624" y="214" width="300" height="120" rx="16" fill="#101628" stroke="#6C5CE7"/>
    <text x="644" y="248" fill="#6C5CE7" font-size="12" letter-spacing="1.4">MCP CLIENT</text>
    <text x="644" y="278" fill="#E6EAF2" font-size="16" font-weight="600">Tool connection</text>
    <text x="644" y="304" fill="#A9B4CC" font-size="13">Discovers tools and data.</text>

    <polyline points="700,334 220,400" fill="none" stroke="#8B97B3" stroke-width="1.3"/>
    <polyline points="740,334 480,400" fill="none" stroke="#8B97B3" stroke-width="1.3"/>
    <polyline points="800,334 740,400" fill="none" stroke="#8B97B3" stroke-width="1.3"/>

    <rect x="36" y="404" width="280" height="110" rx="16" fill="#12182B" stroke="#2EF2A6" stroke-opacity="0.55"/>
    <circle cx="64" cy="440" r="6" fill="#2EF2A6"/>
    <text x="80" y="446" fill="#E6EAF2" font-size="15" font-weight="600">Files and docs</text>
    <text x="56" y="476" fill="#A9B4CC" font-size="13">Pages, repos, tickets.</text>
    <text x="56" y="496" fill="#8B97B3" font-size="12">MCP server</text>

    <rect x="340" y="404" width="280" height="110" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.55"/>
    <circle cx="368" cy="440" r="6" fill="#00D1FF"/>
    <text x="384" y="446" fill="#E6EAF2" font-size="15" font-weight="600">Tools</text>
    <text x="360" y="476" fill="#A9B4CC" font-size="13">Browser, shell, APIs.</text>
    <text x="360" y="496" fill="#8B97B3" font-size="12">MCP server</text>

    <rect x="644" y="404" width="280" height="110" rx="16" fill="#12182B" stroke="#6C5CE7" stroke-opacity="0.7"/>
    <circle cx="672" cy="440" r="6" fill="#6C5CE7"/>
    <text x="688" y="446" fill="#E6EAF2" font-size="15" font-weight="600">Another agent</text>
    <text x="664" y="476" fill="#A9B4CC" font-size="13">Delegate a bounded task.</text>
    <text x="664" y="496" fill="#8B97B3" font-size="12">Agent-to-agent, per post</text>
  </g>
  <text x="36" y="560" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">MCP is an open protocol for connecting an agent host to tools and data. A gateway can sit in front of the model API.</text>
  <text x="36" y="612" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">MCP is established. OmniRoute's claim of MCP and agent-to-agent support is per post, B6.</text>
</svg>
