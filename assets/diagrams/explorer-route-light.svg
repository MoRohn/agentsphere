<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-labelledby="title desc">
  <title id="title">A chatbot waits. An agent finishes.</title>
  <desc id="desc">A chatbot gives one reply and waits. An agent keeps working until the job is done, and you check the result.</desc>
  <text x="40" y="56" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600">A chatbot waits. An agent finishes.</text>
  <rect x="40" y="72" width="96" height="5" rx="2" fill="#F5A31A"/>
  <text x="40" y="112" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">One replies. The other keeps going until the job is done.</text>
  <line x1="40" y1="136" x2="790" y2="136" stroke="#D0D7DE" stroke-width="1.5"/>
  <circle cx="48" cy="176" r="8" fill="#F5A31A"/>
  <text x="72" y="184" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Chatbot</text>
  <text x="72" y="220" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">You ask. It answers. It waits.</text>
  <circle cx="440" cy="176" r="8" fill="#10243F"/>
  <text x="464" y="184" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Agent</text>
  <text x="464" y="220" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">You ask. It does the steps. You check.</text>
</svg>
