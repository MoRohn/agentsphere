<svg xmlns="http://www.w3.org/2000/svg" width="830" height="436" viewBox="0 0 830 436" role="img" aria-labelledby="title desc">
  <title id="title">Find, review, fix, retest</title>
  <desc id="desc">Find, review, fix, retest.</desc>
  <defs>
    <linearGradient id="security-loop-light-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10243F"/>
      <stop offset="1" stop-color="#F5A31A"/>
    </linearGradient>
  </defs>
  <text x="40" y="56" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" text-anchor="start">Find, review, fix, retest</text>
  <g transform="translate(728.00,8.00) scale(0.3438)">
<circle cx="128" cy="128" r="100" fill="#F5A31A"/>
<path d="M 76.1,44.9 A 98,98 0 0 0 76.1,211.1" fill="none" stroke="#10243F" stroke-width="28" stroke-linecap="round"/>
<g transform="translate(128,138)"><rect x="-38" y="-34" width="76" height="70" rx="34" fill="#FFFFFF"/><line x1="0" y1="-32" x2="0" y2="-50" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><line x1="0" y1="-32" x2="0" y2="-50" stroke="#F5A31A" stroke-width="4.4" stroke-linecap="round"/><circle cx="0" cy="-57" r="8.2" fill="#FFFFFF"/><circle cx="0" cy="-57" r="5.5" fill="#F5A31A"/><rect x="-26" y="-8" width="52" height="26" rx="13" fill="#10243F"/><circle cx="-12" cy="5" r="5.5" fill="#F5A31A"/><circle cx="12" cy="5" r="5.5" fill="#F5A31A"/><g fill="none" stroke="#10243F" stroke-width="2.6" stroke-linecap="round"><path d="M 34,-12 H 54"/><path d="M 36,0 H 62"/><path d="M 34,12 H 50"/></g><g fill="#10243F"><circle cx="56" cy="-12" r="2.5"/><circle cx="64" cy="0" r="2.5"/><circle cx="52" cy="12" r="2.5"/></g></g>
  </g>
  <text x="40" y="96" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A person stands between the finding and the change.</text>
  <line x1="40" y1="128" x2="700" y2="128" stroke="#D0D7DE" stroke-width="1.5"/>
  <circle cx="50.0" cy="182" r="8" fill="#F5A31A"/>
  <text x="40.0" y="220" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Find</text>
  <text x="40.0" y="250" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Name the issue.</text>
  <circle cx="439.0" cy="182" r="8" fill="#10243F"/>
  <text x="429.0" y="220" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Review</text>
  <text x="429.0" y="250" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A person decides.</text>
  <circle cx="50.0" cy="292" r="8" fill="#C96E00"/>
  <text x="40.0" y="330" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Fix</text>
  <text x="40.0" y="360" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">The smallest change.</text>
  <circle cx="439.0" cy="292" r="8" fill="#F5A31A"/>
  <text x="429.0" y="330" fill="#1F2328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start">Retest</text>
  <text x="429.0" y="360" fill="#424A53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Show it is gone.</text>
</svg>
