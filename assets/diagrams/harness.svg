<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">An agent is a model plus a harness</title>
  <desc id="desc">The foundation model proposes the next step. Six runtime parts decide what it sees, what enters the call, how the run advances, which actions are allowed, what state persists, and how the run is checked.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1A2444"/>
      <stop offset="1" stop-color="#12182B"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="760" fill="#07090F"/>
  <rect width="1200" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="40" r="8.5" fill="#3A2E9A"/>
  <circle cx="33.4" cy="37.2" r="2.3" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="36" cy="40" r="8.5" fill="none" stroke="#9AF7FF" stroke-width="1.3"/>
  <circle cx="43.2" cy="34.2" r="1.7" fill="#7AF6FF"/>
  <text x="56" y="46" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">An agent is a model plus a harness</text>
  <text x="1164" y="46" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="28" y="76" width="1144" height="92" rx="18" fill="url(#core)" stroke="#00D1FF" stroke-opacity="0.7"/>
    <text x="52" y="106" fill="#7AF6FF" font-size="12" letter-spacing="1.4">FOUNDATION MODEL</text>
    <text x="52" y="136" fill="#E6EAF2" font-size="18" font-weight="600">Reasons, plans, and proposes the next step</text>
    <text x="700" y="136" fill="#A9B4CC" font-size="14">View, permission, and check live in the runtime.</text>

    <rect x="28" y="188" width="368" height="210" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.85"/>
    <text x="48" y="218" fill="#7AF6FF" font-size="12" letter-spacing="1.3">1  OBSERVATION</text>
    <text x="48" y="252" fill="#E6EAF2" font-size="18" font-weight="600">What it can see</text>
    <text x="48" y="284" fill="#A9B4CC" font-size="14">Terminal, diff, page, log,</text>
    <text x="48" y="306" fill="#A9B4CC" font-size="14">rendered for this decision.</text>
    <text x="48" y="340" fill="#7AF6FF" font-size="13">Show the state that matters.</text>
    <text x="48" y="372" fill="#8B97B3" font-size="12">RICH, AND STILL USABLE</text>

    <rect x="416" y="188" width="368" height="210" rx="16" fill="#12182B" stroke="#6C5CE7"/>
    <text x="436" y="218" fill="#C4B8FF" font-size="12" letter-spacing="1.3">2  CONTEXT</text>
    <text x="436" y="252" fill="#E6EAF2" font-size="18" font-weight="600">What enters this call</text>
    <text x="436" y="284" fill="#A9B4CC" font-size="14">Instructions, retrieval, memory,</text>
    <text x="436" y="306" fill="#A9B4CC" font-size="14">and the current task state.</text>
    <text x="436" y="340" fill="#C4B8FF" font-size="13">Select, compress, refresh.</text>
    <text x="436" y="372" fill="#8B97B3" font-size="12">MANAGED, NOT A DUMP</text>

    <rect x="804" y="188" width="368" height="210" rx="16" fill="#12182B" stroke="#6C5CE7" stroke-opacity="0.7"/>
    <text x="824" y="218" fill="#C4B8FF" font-size="12" letter-spacing="1.3">3  CONTROL</text>
    <text x="824" y="252" fill="#E6EAF2" font-size="18" font-weight="600">How the run advances</text>
    <text x="824" y="284" fill="#A9B4CC" font-size="14">Plan, act, retry, delegate,</text>
    <text x="824" y="306" fill="#A9B4CC" font-size="14">or stop.</text>
    <text x="824" y="340" fill="#C4B8FF" font-size="13">Keep the trajectory stable.</text>
    <text x="824" y="372" fill="#8B97B3" font-size="12">ADAPTABLE, AND BOUNDED</text>

    <rect x="28" y="418" width="368" height="210" rx="16" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.55"/>
    <text x="48" y="448" fill="#7AF6FF" font-size="12" letter-spacing="1.3">4  ACTION</text>
    <text x="48" y="482" fill="#E6EAF2" font-size="18" font-weight="600">What it may do</text>
    <text x="48" y="514" fill="#A9B4CC" font-size="14">Tools, shell, browser, APIs.</text>
    <text x="48" y="536" fill="#A9B4CC" font-size="14">A proposal is not yet an act.</text>
    <text x="48" y="570" fill="#7AF6FF" font-size="13">Schema, permission, result.</text>
    <text x="48" y="602" fill="#8B97B3" font-size="12">FLEXIBLE, AND GOVERNED</text>

    <rect x="416" y="418" width="368" height="210" rx="16" fill="#10241C" stroke="#2EF2A6" stroke-opacity="0.75"/>
    <text x="436" y="448" fill="#7DFFC8" font-size="12" letter-spacing="1.3">5  STATE</text>
    <text x="436" y="482" fill="#E6EAF2" font-size="18" font-weight="600">What outlives the call</text>
    <text x="436" y="514" fill="#A9B4CC" font-size="14">Plans, checkpoints, diffs,</text>
    <text x="436" y="536" fill="#A9B4CC" font-size="14">logs, and maintained pages.</text>
    <text x="436" y="570" fill="#7DFFC8" font-size="13">Keep what a later step can open.</text>
    <text x="436" y="602" fill="#8B97B3" font-size="12">COMPLETE ENOUGH TO REUSE</text>

    <rect x="804" y="418" width="368" height="210" rx="16" fill="#10241C" stroke="#2EF2A6"/>
    <text x="824" y="448" fill="#7DFFC8" font-size="12" letter-spacing="1.3">6  VERIFICATION</text>
    <text x="824" y="482" fill="#E6EAF2" font-size="18" font-weight="600">What holds the run</text>
    <text x="824" y="514" fill="#A9B4CC" font-size="14">Tests, gates, sandbox,</text>
    <text x="824" y="536" fill="#A9B4CC" font-size="14">rollback, and a budget.</text>
    <text x="824" y="570" fill="#7DFFC8" font-size="13">Enforce it in the runtime.</text>
    <text x="824" y="602" fill="#8B97B3" font-size="12">CHECKED, AND RECOVERABLE</text>
  </g>
  <text x="36" y="680" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">The six parts are coupled. A richer observation costs context. A wider action needs a stronger check.</text>
  <text x="36" y="716" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Execution harness, as used for LLM agents. Quality is the model and this runtime together.</text>
</svg>
