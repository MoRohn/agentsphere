<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Wiki memory</title>
  <desc id="desc">A question searches the wiki first. Gaps send the agent back to raw sources, and the answer is written into linked pages.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="0.5" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="700" fill="#0B0F1A"/>
  <rect width="960" height="4" fill="url(#bar)"/>
  <circle cx="36" cy="36" r="8" fill="none" stroke="#00D1FF" stroke-width="1.4"/>
  <circle cx="36" cy="36" r="2.5" fill="#6C5CE7"/>
  <text x="54" y="41" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Wiki memory that compounds</text>
  <text x="928" y="41" text-anchor="end" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">agentsphere</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="28" y="76" width="250" height="500" rx="18" fill="#101628" stroke="#00D1FF" stroke-opacity="0.55"/>
    <text x="48" y="112" fill="#00D1FF" font-size="13" letter-spacing="1.6">RAW /</text>
    <text x="48" y="140" fill="#E6EAF2" font-size="18" font-weight="600">Source of truth</text>
    <text x="48" y="166" fill="#A9B4CC" font-size="13">Read. Do not rewrite.</text>
    <rect x="48" y="192" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="64" y="220" fill="#E6EAF2" font-size="14">Notes and posts</text>
    <text x="64" y="240" fill="#8B97B3" font-size="12">kept as they arrived</text>
    <rect x="48" y="270" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="64" y="298" fill="#E6EAF2" font-size="14">Papers, repos, docs</text>
    <text x="64" y="318" fill="#8B97B3" font-size="12">primary material</text>
    <rect x="48" y="348" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="64" y="376" fill="#E6EAF2" font-size="14">Transcripts</text>
    <text x="64" y="396" fill="#8B97B3" font-size="12">evidence, not the wiki</text>
    <text x="48" y="470" fill="#A9B4CC" font-size="13">The agent reads a source</text>
    <text x="48" y="490" fill="#A9B4CC" font-size="13">once, then works from</text>
    <text x="48" y="510" fill="#A9B4CC" font-size="13">the page it wrote.</text>
    <text x="48" y="548" fill="#8B97B3" font-size="12">Per post, B2</text>

    <rect x="682" y="76" width="250" height="500" rx="18" fill="#101628" stroke="#2EF2A6" stroke-opacity="0.6"/>
    <text x="702" y="112" fill="#2EF2A6" font-size="13" letter-spacing="1.6">WIKI /</text>
    <text x="702" y="140" fill="#E6EAF2" font-size="18" font-weight="600">Maintained pages</text>
    <text x="702" y="166" fill="#A9B4CC" font-size="13">Linked, updated, cited.</text>
    <rect x="702" y="192" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="718" y="220" fill="#E6EAF2" font-size="14">Concept pages</text>
    <text x="718" y="240" fill="#8B97B3" font-size="12">one idea, one home</text>
    <rect x="702" y="270" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="718" y="298" fill="#E6EAF2" font-size="14">Links and gaps</text>
    <text x="718" y="318" fill="#8B97B3" font-size="12">what is missing is visible</text>
    <rect x="702" y="348" width="210" height="64" rx="12" fill="#12182B" stroke="#1C2740"/>
    <text x="718" y="376" fill="#E6EAF2" font-size="14">Corrected claims</text>
    <text x="718" y="396" fill="#8B97B3" font-size="12">stale notes get fixed</text>
    <text x="702" y="470" fill="#A9B4CC" font-size="13">Search here first.</text>
    <text x="702" y="490" fill="#A9B4CC" font-size="13">Write the answer back</text>
    <text x="702" y="510" fill="#A9B4CC" font-size="13">before the run ends.</text>
    <text x="702" y="548" fill="#8B97B3" font-size="12">Schema decides edits</text>

    <rect x="300" y="88" width="360" height="56" rx="12" fill="#12182B" stroke="#E6EAF2" stroke-opacity="0.35"/>
    <text x="320" y="122" fill="#E6EAF2" font-size="15" font-weight="600">1  Question arrives</text>

    <rect x="300" y="162" width="360" height="56" rx="12" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.7"/>
    <text x="320" y="196" fill="#E6EAF2" font-size="15" font-weight="600">2  Search the wiki first</text>

    <rect x="300" y="236" width="360" height="72" rx="12" fill="#12182B" stroke="#6C5CE7"/>
    <text x="320" y="266" fill="#E6EAF2" font-size="15" font-weight="600">3  Is there a gap?</text>
    <text x="320" y="288" fill="#A9B4CC" font-size="13">No gap: answer from the pages.</text>

    <rect x="300" y="326" width="360" height="56" rx="12" fill="#12182B" stroke="#00D1FF" stroke-opacity="0.45"/>
    <text x="320" y="360" fill="#E6EAF2" font-size="15" font-weight="600">4  Gap: read raw sources</text>

    <rect x="300" y="400" width="360" height="72" rx="12" fill="#12182B" stroke="#2EF2A6" stroke-opacity="0.8"/>
    <text x="320" y="430" fill="#E6EAF2" font-size="15" font-weight="600">5  Write the page back</text>
    <text x="320" y="452" fill="#A9B4CC" font-size="13">Link it. Note gaps. Fix stale claims.</text>

    <rect x="300" y="490" width="360" height="64" rx="12" fill="#10241C" stroke="#2EF2A6"/>
    <text x="320" y="518" fill="#2EF2A6" font-size="15" font-weight="600">6  Next run starts smarter</text>
    <text x="320" y="538" fill="#A9B4CC" font-size="13">One hundred questions, one system.</text>

    <polyline points="480,144 480,162" fill="none" stroke="#8B97B3" stroke-width="1.4"/>
    <polygon points="474,156 480,168 486,156" fill="#8B97B3"/>
    <polyline points="480,218 480,236" fill="none" stroke="#8B97B3" stroke-width="1.4"/>
    <polygon points="474,230 480,242 486,230" fill="#8B97B3"/>
    <polyline points="480,308 480,326" fill="none" stroke="#8B97B3" stroke-width="1.4"/>
    <polygon points="474,320 480,332 486,320" fill="#8B97B3"/>
    <polyline points="480,382 480,400" fill="none" stroke="#8B97B3" stroke-width="1.4"/>
    <polygon points="474,394 480,406 486,394" fill="#8B97B3"/>
    <polyline points="480,472 480,490" fill="none" stroke="#2EF2A6" stroke-width="1.4"/>
    <polygon points="474,484 480,496 486,484" fill="#2EF2A6"/>

    <text x="300" y="610" fill="#A9B4CC" font-size="13">Pages outlive the chat. The agent can read them, link them, and correct them.</text>
    <text x="300" y="634" fill="#8B97B3" font-size="12">Per post: raw/ = source of truth, wiki/ = maintained knowledge, schema = update rules.</text>
  </g>
  <text x="28" y="680" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Source B2 · docs/01-agent-patterns/wiki-memory.md</text>
</svg>
