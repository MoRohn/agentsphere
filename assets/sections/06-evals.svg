<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Evals</title>
  <desc id="desc">Section art. Checkpoints on a rising line.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00D1FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="55%" r="28%">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0B0F1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" fill="#0B0F1A"/>
  <rect width="1200" height="240" fill="url(#glow)"/>
  <text x="64" y="78" fill="#00D1FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.4">06  ·  EVALS</text>
  <text x="64" y="136" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="650">Did it get better</text>
  <text x="64" y="180" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Task success, trajectories, and a wiki that improves.</text>
  <polyline points="880,176 960,140 1040,112 1120,72" fill="none" stroke="#6C5CE7" stroke-width="1.8"/>
  <circle cx="880" cy="176" r="7" fill="#0B0F1A" stroke="#00D1FF" stroke-width="2"/>
  <circle cx="960" cy="140" r="7" fill="#0B0F1A" stroke="#6C5CE7" stroke-width="2"/>
  <circle cx="1040" cy="112" r="7" fill="#0B0F1A" stroke="#00D1FF" stroke-width="2"/>
  <circle cx="1120" cy="72" r="8" fill="#2EF2A6"/>
  <rect y="236" width="1200" height="4" fill="url(#bar)"/>
</svg>
