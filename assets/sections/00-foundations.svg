<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Foundations</title>
  <desc id="desc">Section art. A single loop around a sphere.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00D1FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="30%">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0B0F1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" fill="#0B0F1A"/>
  <rect width="1200" height="240" fill="url(#glow)"/>
  <text x="64" y="78" fill="#00D1FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.4">00  ·  FOUNDATIONS</text>
  <text x="64" y="136" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="650">What an agent is</text>
  <text x="64" y="180" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">A model in a loop, with tools, memory, and a stop.</text>
  <g fill="none" stroke-linecap="round">
    <circle cx="980" cy="120" r="72" stroke="#6C5CE7" stroke-opacity="0.85" stroke-width="1.6"/>
    <ellipse cx="980" cy="120" rx="72" ry="26" stroke="#00D1FF" stroke-width="1.4"/>
    <ellipse cx="980" cy="120" rx="22" ry="72" stroke="#E6EAF2" stroke-opacity="0.45" stroke-width="1.2"/>
    <ellipse cx="980" cy="120" rx="108" ry="36" transform="rotate(-20 980 120)" stroke="#2EF2A6" stroke-opacity="0.8" stroke-width="1.4"/>
  </g>
  <circle cx="1072" cy="78" r="6" fill="#00D1FF"/>
  <circle cx="892" cy="104" r="6" fill="#6C5CE7"/>
  <circle cx="1048" cy="176" r="6" fill="#2EF2A6"/>
  <rect y="236" width="1200" height="4" fill="url(#bar)"/>
</svg>
