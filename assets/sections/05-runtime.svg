  <text x="64" y="78" fill="#00D1FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.4">05  ·  RUNTIME AND INFRA</text>
  <text x="64" y="136" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="650">Where the agent runs</text>
