<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent</title>
  <desc id="desc">Section art. A lead node with phased satellites.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#2EF2A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="48%" r="28%">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0B0F1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="240" fill="#0B0F1A"/>
  <rect width="1200" height="240" fill="url(#glow)"/>
  <text x="64" y="78" fill="#00D1FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.4">04  ·  MULTI-AGENT</text>
  <text x="64" y="136" fill="#E6EAF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="650">Plans across agents</text>
  <text x="64" y="180" fill="#A9B4CC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">A lead writes phases. Workers run. Results merge.</text>
  <g stroke="#E6EAF2" stroke-opacity="0.3" stroke-width="1.2">
    <line x1="980" y1="128" x2="900" y2="70"/>
    <line x1="980" y1="128" x2="1064" y2="64"/>
    <line x1="980" y1="128" x2="990" y2="196"/>
  </g>
  <circle cx="980" cy="128" r="18" fill="#6C5CE7"/>
  <circle cx="980" cy="128" r="5" fill="#E6EAF2"/>
  <circle cx="900" cy="70" r="9" fill="#00D1FF"/>
  <circle cx="1064" cy="64" r="9" fill="#2EF2A6"/>
  <circle cx="990" cy="196" r="9" fill="#E6EAF2"/>
  <text x="888" y="54" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">P1</text>
  <text x="1072" y="52" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">P2</text>
  <text x="1004" y="214" fill="#8B97B3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">P3</text>
  <rect y="236" width="1200" height="4" fill="url(#bar)"/>
</svg>
